[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cbas-iiot"
version = "0.1.0"
description = "Certificate-Based Aggregate Signature scheme for IIoT (Qiao et al., IEEE Systems Journal 2023) - Python wrapper over native libsodium"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]
bench = ["numpy", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
